<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>群星控制台面板</title>
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <div class="logo">S</div>
      <div>
        <h1>群星控制台面板</h1>
        <p>3.0.0 – 4.4.6+ 分类按钮 · 一键发送到游戏控制台</p>
      </div>
    </div>
    <div class="status" id="status">就绪</div>
  </header>

  <section class="toolbar">
    <label>游戏版本
      <select id="version"></select>
    </label>
    <label class="grow">搜索
      <input id="q" placeholder="女王泰坦 / add_ship / 戴森球" />
    </label>
    <label class="target">目标
      <select id="targetPick" title="默认玩家。需要数字的命令会把 ID 写入命令；annex / kill_country 仅在非 0 时写入。">
        <option value="0" selected>玩家 (0)</option>
        <option value="1">帝国 1</option>
        <option value="2">帝国 2</option>
        <option value="custom">自定义 ID</option>
      </select>
    </label>
    <label class="target custom-id" id="targetCustomWrap" hidden>
      自定义 ID
      <input id="targetId" inputmode="numeric" placeholder="debugtooltip 查看" title="控制台输入 debugtooltip 后，把鼠标移到舰船、星球或帝国上查看 ID" />
    </label>
    <label class="check">
      <input id="hideMissing" type="checkbox" />
      隐藏不可用
    </label>
    <label>开控制台键
      <select id="consoleKey">
        <option value="oem3">~ / `</option>
        <option value="shift+2">Shift+2</option>
        <option value="shift+3">Shift+3</option>
        <option value="alt+21">Alt+2+1</option>
        <option value="f12">F12</option>
      </select>
    </label>
    <label>控制台
      <select id="consoleReady">
        <option value="ready">已打开，只输入回车</option>
        <option value="open">每次先开控制台</option>
      </select>
    </label>
    <button id="btnOpenConsole" type="button">打开控制台</button>
    <button id="btnDetect" type="button">检测窗口</button>
    <button id="btnAdminHint" type="button">管理员说明</button>
  </section>

  <section class="paths">
    <label class="grow">游戏根目录
      <input id="gameRoot" placeholder="D:\Steam\steamapps\common\Stellaris" />
    </label>
    <label class="grow">创意工坊 / MOD
      <input id="workshop" placeholder="...\steamapps\workshop\content\281990" />
    </label>
    <label class="grow">额外 MOD 目录
      <input id="extraMods" placeholder="可选：本地 MOD 根目录" />
    </label>
    <button id="btnScan" type="button">扫描游戏与MOD</button>
  </section>

  <nav class="cats" id="cats"></nav>
  <div class="meta" id="meta"></div>
  <div class="grid" id="grid"></div>
  <div id="tip" class="tip" hidden></div>
  <footer class="pager">
    <button id="prev" type="button">上一页</button>
    <span id="pageInfo">1 / 1</span>
    <button id="next" type="button">下一页</button>
    <span class="version" id="appVersion"></span>
  </footer>
  <script src="/static/app.js"></script>
</body>
</html>
